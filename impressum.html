<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Impressum — Damian Berens</title>
  <style>
    :root{
      --paper:#f4f1ea;
      --ink:#252525;
      --muted:#69665f;
      --line:#cfc9bd;
      --serif: Georgia, "Times New Roman", serif;
      --mono: "Courier New", Courier, monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--serif);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }
    .shell{
      width:min(calc(100% - 40px), 820px);
      margin:0 auto;
    }
    header{
      padding:32px 0;
      border-bottom:1px solid var(--line);
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.75rem;
    }
    header a{color:inherit;text-decoration:none}
    main{padding:80px 0 100px}
    .label{
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:.22em;
      font-size:.75rem;
      color:var(--muted);
      margin:0 0 16px;
    }
    h1{
      margin:0 0 52px;
      font-size:clamp(3.3rem,9vw,6.4rem);
      line-height:.9;
      font-weight:400;
      letter-spacing:-.045em;
    }
    h2{
      margin:42px 0 12px;
      font-size:1.25rem;
      font-weight:400;
    }
    p{font-size:1.08rem;margin:0 0 1.2em}
    a{color:inherit}
    footer{
      border-top:1px solid var(--line);
      padding:30px 0 45px;
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:.7rem;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <a href="index.html">← Damian Berens</a>
    </div>
  </header>

  <main class="shell">
    <p class="label">Legal</p>
    <h1>Impressum</h1>

    <h2>Angaben gemäß § 5 DDG</h2>
    <p>
      Damian Berens<br>
      Birrekoven 55<br>
      53347 Alfter<br>
      Deutschland
    </p>

    <h2>Kontakt</h2>
    <p>
      E-Mail:
      <a href="mailto:damianberens@hotmail.com">damianberens@hotmail.com</a>
    </p>
  </main>

  <footer>
    <div class="shell">© 2026 Damian Berens</div>
  </footer>
</body>
</html>
